name: Czyszczenie starych plików GIF

on:
  schedule:
    # Automatyczne uruchamianie w każdą niedzielę o 00:00 czasu UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Pozwala uruchomić proces ręcznie w dowolnym momencie

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Pobiera pełną historię, co zapobiega błędom przy nadpisywaniu commitów

    - name: Usunięcie plików .gif starszych niż 7 dni
      run: |
        # Sprawdzamy czy folder gifs w ogóle istnieje
        if [ -d "gifs" ]; then
          # Wyszukuje i kasuje pliki .gif starsze niż 7 dni wewnątrz folderu gifs
          find gifs -type f -name "*.gif" -mtime +7 -delete
        else
          echo "Folder gifs nie istnieje."
        fi

    - name: Nadpisanie historii (Force Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        git add .
        
        # Sprawdzenie czy skrypt faktycznie coś skasował
        if ! git diff-index --quiet HEAD; then
          echo "Wykryto zmiany. Usuwam stare pliki z historii..."
          git commit -m "Automatyczne oczyszczenie folderu gifs ze starych plików GIF"
          git push origin HEAD --force
          echo "Stare pliki GIF zostały pomyślnie usunięte."
        else
          echo "Brak plików GIF starszych niż 7 dni w folderze gifs. Nic do zrobienia."
        fi
